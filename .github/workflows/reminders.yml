name: Daily Contract Reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminders
        run: |
          curl -X GET -H "X-Cron-Secret: $CRON_SECRET" \
            https://muraai-contract-remainder.onrender.com/run-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}