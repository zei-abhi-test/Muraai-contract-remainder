name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest, black, flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MURAAI/backend
    env:
      # Mirror tests/conftest.py so the suite runs against a fresh in-memory
      # SQLite database and the scheduler stays disabled.
      SECRET_KEY: test-secret-key-12345678901234567890
      EMAIL_USER: test@example.com
      EMAIL_PASSWORD: test-password
      DATABASE_URL: sqlite:///:memory:
      FLASK_ENV: testing
      RUN_SCHEDULER: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      - name: Run tests (fresh SQLite test DB)
        run: python -m pytest

      - name: Check formatting (black)
        run: python -m black --check src tests migrations

      - name: Lint (flake8)
        run: python -m flake8 --jobs=1 src tests migrations

  frontend:
    name: Frontend (npm install + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MURAAI/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MURAAI/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (typecheck + vite)
        run: npm run build
