openapi: 3.0.3
info:
  title: Muraai Contract Reminder API
  version: 1.0.0
  description: API for managing contract end-date reminders and notifications.
servers:
  - url: http://localhost:5000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Contract:
      type: object
      properties:
        id:
          type: integer
        company_name:
          type: string
        contract_name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        renewal_date:
          type: string
          format: date
          description: Stored reference date. Reminder scheduling is based on end_date.
        notification_enabled:
          type: boolean
        notification_email:
          type: string
          format: email
        notification_mobile:
          type: boolean
        notes:
          type: string
        user_id:
          type: integer
    Notification:
      type: object
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        notification_type:
          type: string
          enum: [email, mobile]
        status:
          type: string
          enum: [pending, sent, failed]
        message:
          type: string
        send_date:
          type: string
          format: date-time
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy.
  /api/auth/register:
    post:
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: john_doe
              email: john@example.com
              password: securepassword123
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: john@example.com
              password: securepassword123
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/me:
    get:
      summary: Get current user
      responses:
        '200':
          description: Current user.
  /api/contracts:
    get:
      summary: List current user's contracts
      parameters:
        - name: upcoming_only
          in: query
          description: When true, returns contracts with end_date in the next 30 days.
          schema:
            type: boolean
        - name: status
          in: query
          description: Filter contracts by end_date status. active means more than 30 days remain, ending-soon means today through the next 30 days, critical means today through the next 7 days, and expired means end_date is before today.
          schema:
            type: string
            enum: [active, ending-soon, critical, expired]
      responses:
        '200':
          description: Contract list.
    post:
      summary: Create a contract for the current user
      requestBody:
        required: true
        content:
          application/json:
            example:
              company_name: Acme Corp
              contract_name: Software License
              start_date: '2026-01-01'
              end_date: '2026-12-31'
              renewal_date: '2026-12-31'
              notification_enabled: true
              notification_email: john@example.com
              notification_mobile: false
              notes: Annual renewal
      responses:
        '201':
          description: Contract created.
  /api/contracts/{contract_id}:
    get:
      summary: Get one owned contract
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contract.
    put:
      summary: Update one owned contract
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contract updated.
    delete:
      summary: Delete one owned contract
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Contract deleted.
  /api/contracts/dashboard:
    get:
      summary: Current user's dashboard metrics and grouped contract lists
      responses:
        '200':
          description: Dashboard payload with active_contracts, ending_soon_contracts, critical_contracts, expired_contracts, reminder statistics, and backward-compatible upcoming/overdue fields.
  /api/customers:
    get:
      summary: List reusable customers for the current user
      responses:
        '200':
          description: Customer list.
    post:
      summary: Create a reusable customer
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Acme Corp
              customer_code: ACM-001
              phone: '+91 9876543210'
              email: admin@acme.example
              address: Bengaluru
      responses:
        '201':
          description: Customer created.
  /api/customers/{customer_id}/contacts:
    get:
      summary: List contact people for one customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contact list.
    post:
      summary: Create a reusable contact person for one customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              contact_name: Priya Sharma
              contact_number: '+91 9876543210'
              email: priya@acme.example
              designation: Procurement Manager
      responses:
        '201':
          description: Contact created.
  /api/contacts:
    get:
      summary: List reusable contact people for the current user
      parameters:
        - name: customer_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Contact list.
  /api/contracts/{contract_id}/line-items:
    get:
      summary: List contract line items
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Line item list.
    post:
      summary: Add a contract line item and recalculate total value
      requestBody:
        required: true
        content:
          application/json:
            example:
              product: Cloud license
              quantity: 10
              rate: 350
              remarks: Annual billing
      responses:
        '201':
          description: Line item created.
  /api/contracts/{contract_id}/documents:
    get:
      summary: List uploaded document metadata for a contract
      responses:
        '200':
          description: Document metadata list.
    post:
      summary: Upload a contract document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded.
  /api/contracts/{contract_id}/renew:
    post:
      summary: Renew a contract by creating a linked new version
      description: Renewal never overwrites the old contract. It creates a new contract linked through parent_contract_id and previous_contract_id.
      responses:
        '201':
          description: Renewed contract created.
  /api/contracts/{contract_id}/renewal-history:
    get:
      summary: List all versions in a contract renewal chain
      responses:
        '200':
          description: Renewal history.
  /api/reports/{report_name}:
    get:
      summary: Run a management report
      description: report_name supports active-contracts, expiring-contracts, expired-contracts, customers, contacts, and line-items.
      responses:
        '200':
          description: Report payload.  /api/notifications:
    get:
      summary: List current user's notification history
      parameters:
        - name: contract_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Notification list.
    post:
      summary: Create a notification record for an owned contract
      responses:
        '201':
          description: Notification created.
